<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e5a3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Golf Stats">
  <meta name="description" content="On-course golf stat tracker built around the scoring zone.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Golf Stats</title>
</head>
<body>
  <header class="top">
    <h1 id="title">Golf Stats</h1>
    <div id="topRight"></div>
  </header>

  <main id="main" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-view="play" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V3l11 4.5L8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="9" cy="21" rx="6" ry="1.4" fill="currentColor" opacity=".35"/></svg>
      <span>Play</span>
    </button>
    <button data-view="rounds" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Rounds</span>
    </button>
    <button data-view="stats" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Stats</span>
    </button>
    <button data-view="settings" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>More</span>
    </button>
  </nav>

  <div id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="app.js"></script>
  <script src="map.js"></script>
  <script src="features.js"></script>
</body>
</html>
