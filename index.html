<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Golf Stats">
  <meta name="description" content="On-course golf stat tracker built around the scoring zone.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=27">
  <title>Golf Stats</title>
</head>
<body>
  <header class="top">
    <h1 id="title">Golf Stats</h1>
    <div id="topRight"></div>
  </header>

  <main id="main" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-view="home" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </button>
    <button data-view="play" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V3l11 4.5L8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="9" cy="21" rx="6" ry="1.4" fill="currentColor" opacity=".35"/></svg>
      <span>Play</span>
    </button>
    <button data-view="stats" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Stats</span>
    </button>
    <button data-view="practice" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
      <span>Practice</span>
    </button>
  </nav>

  <div id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="app.js?v=27"></script>
  <script src="map.js?v=27"></script>
  <script src="features.js?v=27"></script>
  <script src="courses.js?v=27"></script>
  <script src="preview.js?v=27"></script>
  <script src="profile.js?v=27"></script>
  <script src="replay.js?v=27"></script>
  <script src="stats.js?v=27"></script>
  <script src="players.js?v=27"></script>
  <script src="sg.js?v=27"></script>
  <script src="clubs.js?v=27"></script>
</body>
</html>
